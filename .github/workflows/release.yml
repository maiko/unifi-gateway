name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  PYINSTALLER_ARGS: >-
    --onefile
    --name unifi-gateway
    --add-data LICENSE:.
    --hidden-import Crypto.Cipher._mode_cbc
    --hidden-import Crypto.Cipher._mode_gcm
    --hidden-import Crypto.Cipher._mode_ecb
    --hidden-import Crypto.Util.Padding
    --hidden-import Crypto.Random
    unifi_gateway.py

jobs:
  # ── Build PyInstaller binaries ──────────────────────────────────────

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            suffix: linux-amd64
            deb_arch: amd64
          - arch: arm64
            platform: linux/arm64
            suffix: linux-arm64
            deb_arch: arm64
          - arch: armhf
            platform: linux/arm/v7
            suffix: linux-armhf
            deb_arch: armhf

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary + packages
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/build -w /build \
            python:3.12-slim bash -c '
              set -e
              apt-get update && apt-get install -y --no-install-recommends \
                gcc libc6-dev zlib1g-dev dpkg-dev debhelper binutils build-essential python3

              # Build PyInstaller binary
              pip install --no-cache-dir -r requirements.txt pyinstaller
              pyinstaller ${{ env.PYINSTALLER_ARGS }}
              ./dist/unifi-gateway --help
              cp dist/unifi-gateway dist/unifi-gateway-${{ matrix.suffix }}

              # Build .deb
              sed -i "1s/([^)]*)/('"${{ steps.version.outputs.version }}"'-1)/" debian/changelog
              dpkg-buildpackage -us -uc -b -a${{ matrix.deb_arch }}
              mkdir -p output
              mv ../*.deb output/
            '

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/unifi-gateway-${{ matrix.suffix }}

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: output/*.deb

  # ── Docker multi-arch image ────────────────────────────────────────

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── GitHub Release ─────────────────────────────────────────────────

  release:
    needs: [build-linux, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: binary-*
          merge-multiple: true

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: deb-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/unifi-gateway-*
            packages/*.deb
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
