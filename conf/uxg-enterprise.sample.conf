[global]
disable_broadcast = True
# For same-VLAN discovery, set disable_broadcast to False and select the
# bridge host address on the controller's VLAN. Keep the directed inform URL.
# discovery_source_ipv4 = 192.0.2.10

[gateway]
device = UXGENT
platform = vyos
url = http://controller.example.test:8080/inform
hostname = VyOS Enterprise
lan_ip = 192.0.2.1
# Omit lan_mac to generate a persistent locally administered identity.
# Replace realif values with the stock router's physical interfaces.
# Leave the independent VyOS management interface out of this mapping.
# Map the unnumbered br0 row to the routed default LAN, including its IPv6 link-local address.
ports = [
    {"ifname": "eth0", "name": "WAN",  "type": "wan",  "realif": "eth1", "port_idx": 1},
    {"ifname": "eth1", "name": "LAN",  "type": "lan",  "realif": "eth2", "port_idx": 2},
    {"ifname": "eth2", "name": "LAN2", "type": "lan2", "realif": "eth3", "port_idx": 3},
    {"ifname": "eth3", "name": "LAN3", "type": "lan",  "realif": "eth4", "port_idx": 4},
    {"ifname": "eth4", "name": "WAN2", "type": "wan2", "realif": "eth5", "port_idx": 5},
    {"ifname": "eth5", "name": "LAN4", "type": "lan",  "realif": "eth6", "port_idx": 6},
    {"ifname": "br0",  "name": "LAN",  "type": "lan",  "realif": "br0"}
    ]

[vyos]
api_url = https://router.example.test

# BGP requires firewall reconciliation and [vyos_restart] recover_provisioning.
# Native controller upload is experimental. Enable advertisement only on an
# enrollment where you intend to validate the BGP workflow.
# [vyos_bgp]
# enabled = False
# advertise = False
# peer = 192.0.2.2
# To approve several peers with common filters, use peers instead of peer.
# For IPv6, use an unscoped IPv6 peer and IPv6 prefixes. Disable implicit
# IPv4 unicast in the FRR upload with "no bgp default ipv4-unicast" before
# declaring peers. For a mixed upload, approve peers and exact import and
# export prefixes in both families. An approved transport peer may activate
# both families when also listed in dual_stack_peers. For IPv6 transport,
# include "neighbor <IPv6 peer> capability extended-nexthop" before
# the address-family sections.
# dual_stack_peers = ["192.0.2.2"]
# peers = ["192.0.2.2", "192.0.2.3"]
# import_prefixes = ["198.51.100.0/24"]
# export_prefixes = ["203.0.113.0/24"]

# Each enrolled Shadow Mode router needs its own LAN address in addition to
# the ordinary gateway address. Enable the existing probe and provisioning
# settings and install the restricted router-side helpers before pairing.
# [vyos_shadow]
# probe_enabled = True
# provisioning_enabled = True
# lan_election_address = 192.0.2.2/24
# Standby only. Set when the verified COMPLETE policy has a different
# unmanaged fingerprint from the ordinary standby configuration.
#complete_unmanaged_baseline_sha256 = <verified-standby-complete-sha256>

# Optional primary coordinator. Use a distinct credential directory and
# the existing standby daemon's canonical state file. Both daemons need
# access to their private journal directories within the same trust boundary.
# The packaged unifi-gateway-shadow.service derives the standby paths and
# the controller credential file paths from its role directories.
# [vyos_shadow_primary]
# enabled = True
# Capability negotiation requires two prepared routers under
# unifi-gateway-shadow.service. Native pairing and failover remain experimental.
# advertise_managed_shadow = False
# standby_enrollment = /etc/unifi-gateway/standby/site.conf
# standby_state = /var/lib/unifi-gateway-shadow/standby/gateway.conf
# controller_origin = https://controller.example.test
# site = enterprise
# site_id = replace-with-controller-site-id
# controller_ca_file = /etc/unifi-gateway/controller-ca.pem
# controller_session_file = /run/unifi-gateway-shadow/network-session.cookies
# lan_probe_destination = 192.0.2.50
# If the executable uses a restricted local socket, grant the pair service
# access with a systemd SupplementaryGroups drop-in for the socket's group.
# forwarding_probe = /usr/local/libexec/unifi-shadow-forwarding-probe

# Optional provisioning scopes. Configure only resources owned by the bridge.
# Some scopes require the exact topology listed in docs/provisioning.md.
# [vyos_firewall]
# enabled = false
# interfaces = {"192.168.110.0/24":"eth3.110","192.168.120.0/24":"eth3.120"}
# ipv6_interfaces = {"fd42:7891:110::/64":"eth3.110","fd42:7891:120::/64":"eth3.120"}
# rule_base = 80200
# unmanaged_baseline_sha256 =
# [vyos_dhcp]
# enabled = false
# bridge = br110
# interface = eth3.110
# shared_network = unifi-vlan110
# subnet_id = 110
# [vyos_static_routes]
# enabled = false
# destinations = ["198.19.210.20/32"]
# next_hops = {"198.18.210.2":"eth3.210","198.18.220.2":"eth3.220"}
# interface_ids = {"br220":"eth3.220"}
# [vyos_dns]
# enabled = false
# zone = gateway.example.test
# [vyos_source_nat]
# enabled = false
# source = 192.168.110.0/24
# destination = 192.168.120.2
# bridge = br120
# interface = eth3.120
# rule_base = 80100
# ports = [8443, 8444]
# translation_addresses = ["192.168.120.1"]
# [vyos_wireguard]
# enabled = false
# wan_id = eth0
# wan_interface = eth3.210
# wan_cidr = 198.18.210.1/30
# interface = wg119
# server_id = 1
# ports = [51820, 51821]
# tunnel_cidr = 172.29.91.1/24
# peer_cidr = 172.29.91.2/32
# wan_peer = 198.18.210.2
# target = 192.168.120.2
# target_interface = eth3.120
# target_port = 8444
# guard_rule_base = 79000
# [vyos_port_forward]
# enabled = false
# wan_id = eth0
# wan_interface = eth3.210
# wan_cidr = 198.18.210.1/30
# peer = 198.18.210.2
# lan_bridge = br120
# lan_interface = eth3.120
# lan_cidr = 192.168.120.1/24
# target = 192.168.120.2
# ports = [[18446, 8444], [18447, 8443]]
# rule_base = 80150
# guard_rule_base = 79100
# [vyos_vlan]
# Include a LAN port mapping {"ifname": "br130", "realif": "eth3.130", "type": "lan", "name": "VLAN 130"}.
# enabled = false
# parent = eth3
# vlan_id = 130
# address = 192.168.130.1/24
# [vyos_mdns]
# enabled = false
# interfaces = {"br110":"eth3.110", "br120":"eth3.120"}
# addresses = {"br110":"192.168.110.1/24", "br120":"192.168.120.1/24"}
# Select container for large service lists after preloading the reflector image in VyOS.
# engine = stock
# container_image = localhost/uxg-mdns-reflector:local
# container_image_id = <64-digit-image-ID>
# [vyos_ospf]
# enabled = false
# controller_interface = br120
# vyos_interface = eth3.120
# interface_address = 192.168.120.1/24
# report_routes = false
# [vyos_ipsec]
# enabled = false
# wan_id = eth0
# wan_interface = eth3.210
# wan_cidr = 198.18.210.1/30
# lan_id = br120
# lan_interface = eth3.120
# lan_cidr = 192.168.120.1/24
# remote_peer = 198.18.210.2
# local_selector = 192.168.120.2/32
# remote_selector = 198.19.210.240/32
# name = UNIFI-IPSEC
# guard_rule_base = 79200
# Install and verify the required OpenVPN guard rules on VyOS before activation.
# [vyos_openvpn]
# enabled = false
# Required. Match the exact common name in the peer certificate and the imported profile.
# server_name = vpn.example.net
# ca_name = UNIFI-OPENVPN-CA
# certificate_name = UNIFI-OPENVPN-CLIENT
# guard_rule_base = 79300
# [vyos_wan_failover]
# enabled = false
# Use the routing SSH observer below or an existing local command.
# fib_command = /usr/local/libexec/unifi-gateway/wan-fib
# With WAN failover and policy routing enabled, the bridge prepares VyOS table 179.
# Reserve IPv4 forwarding rules 1 and 2 for the policy route Kill Switch guards.
# Enable recover_provisioning in [vyos_restart] for the stock VyOS commit proof.
# [vyos_policy_route]
# enabled = false
# fib_command = /usr/local/libexec/unifi-gateway/policy-route-fib
# [vyos_routing_ssh]
# enabled = false
# ssh_user = vyos
# ssh_port = 22
# Reserve IPv4 forwarding rules 1 and 2 for the scoped speed-limit profile.
# [vyos_qos]
# enabled = false
# kernel_command = /usr/local/libexec/unifi-gateway/qos-kernel
# [vyos_inspection]
# enabled = false
# networks = ["br110", "br120"]
# vendor_controls_sha256 =
# command = /usr/local/libexec/unifi-gateway/inspection
# Use SSH instead of command for the approved stock queue. The address must
# match the literal management IPv4 address in [vyos] api_url.
# ssh_host = 192.0.2.1
# ssh_port = 22
# ssh_user = vyos
# For the scoped stock queue, supply the approved topology JSON and use the
# engine-only runner. See docs/provisioning.md.
# stock_queue =
# [vyos_wan_health]
# enabled = false
# ssh_user = vyos
# probes = {"eth0":{"target":"198.18.210.2","ssh_key_file":"wan1-ssh-key"}}
# [vyos_restart]
# enabled = false
# recover_provisioning = false
# ssh_user = vyos
# ssh_port = 22
# forwarding_probe = /usr/local/libexec/unifi-gateway/restart-forwarding-probe
# [vyos_speedtest]
# enabled = false
# command = /usr/local/libexec/unifi-gateway/wan-speedtest
# timeout = 45
# server_provider =
# server_location =
# [vyos_security_events]
# enabled = false
# automatic_drop_delivery = false
# automatic_notify_delivery = false
# host = 192.0.2.2
# port = 5671
# site_id = 00000000-0000-0000-0000-000000000000
# tls_hostname = mq.unifi.ui.com
# ca_sha256 =
# Automatic delivery defaults to security-events.sqlite next to gateway.conf.
# journal_path = /var/lib/unifi-gateway/security-events.sqlite
